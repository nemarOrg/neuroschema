name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "feature/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv pip install -e ".[dev,views]" --system

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: pytest tests/ --cov --cov-report=term-missing

  view-vectors:
    # Regenerates the sensor-field and sensor-layout vectors from eegprep at the
    # pinned commit, and the ic-activity vectors with scipy, and fails if they
    # differ from the committed files.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Check the view vectors
        run: >-
          uv run --locked --python 3.12 --extra views --group vectors
          python scripts/generate_view_vectors.py --check

      - name: Check the ic-activity vectors against scipy
        run: >-
          uv run --locked --python 3.12 --extra views --group vectors
          python scripts/generate_ic_activity_vectors.py --check

  ajv:
    # Compiles every schema with ajv 8 in strict mode, as a TypeScript renderer
    # does, and replays the verdict corpus and the view examples against it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install ajv
        run: bun install --frozen-lockfile --cwd scripts/ajv

      - name: Compile the schemas and replay the verdicts
        run: bun scripts/ajv/check.ts

  schema-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON files
        run: |
          for f in schema/**/*.schema.json examples/*.json examples/views/*.json; do
            python -m json.tool "$f" > /dev/null || { echo "Invalid JSON: $f"; exit 1; }
          done
