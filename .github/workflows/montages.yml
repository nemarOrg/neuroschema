name: Montages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "feature/**"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Regenerate the montages and sensor-labels vectors
        run: uv run --locked --python 3.12 --group vectors python scripts/generate_montages.py --check
